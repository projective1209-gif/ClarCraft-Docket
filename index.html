<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#30202f" />
    <title>Docket — Your business workspace.</title>
    <meta
      name="description"
      content="Docket by ClarCraft. A private, offline-first workspace for clients, projects, invoices and business finances."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <a class="brand" href="#dashboard"
        ><span class="brand-mark">d<span>•</span></span
        >Docket</a
      >
      <div class="workspace">
        <span class="avatar">DK</span>
        <div>
          <strong>Your workspace</strong><small>Business workspace</small>
        </div>
        <span class="workspace-dot"></span>
      </div>
      <div class="nav-label">YOUR WORKSPACE</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="local-note">
          <span class="safe-dot"></span> Local data storage
          <p>Back up your records regularly.</p>
        </div>
        <a href="#guide" class="help-link"
          >ⓘ <span>Setup guide & FAQ</span><span>↗</span></a
        >
        <div class="sidebar-foot">BUSINESS WORKSPACE <span>v1.4</span></div>
      </div>
    </aside>
    <button
      id="nav-backdrop"
      aria-label="Close navigation"
      tabindex="-1"
    ></button>
    <div id="onboarding-root"></div>
    <div class="shell">
      <header>
        <div class="breadcrumb">
          <button
            id="menu"
            aria-label="Toggle navigation"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            ☰</button
          ><span>Workspace</span><span class="slash">/</span
          ><strong id="crumb">Overview</strong>
        </div>
        <div class="header-right">
          <span class="save-status"><i></i> Saved locally</span
          ><button class="icon-button" onclick="navigate('guide')" title="Help">
            ?</button
          ><span class="avatar small">DK</span>
        </div>
      </header>
      <main id="main"></main>
      <footer>
        <span><a href="#developer">Developed by ClarCraft</a></span
        ><span
          >Docket <span class="tiny-star">·</span> Private, single-user
          workspace.</span
        >
      </footer>
    </div>
    <dialog id="modal" aria-labelledby="dialog-title">
      <div id="modal-content"></div>
    </dialog>
    <dialog id="confirm-modal" aria-labelledby="confirm-title"></dialog>
    <div id="toast" role="status"></div>
    <div id="print-area"></div>
    <div id="pwa-controls" class="pwa-controls">
      <button type="button" class="btn small" id="pwa-install">
        Install app</button
      ><button type="button" class="btn small" id="pwa-update" hidden>
        Update available</button
      ><span id="pwa-status" role="status"></span>
    </div>
    <script src="app.js"></script>
    <script src="select-enhancements.js"></script>
    <script src="pwa.js"></script>
  </body>
</html>
